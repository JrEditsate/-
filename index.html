<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>NEON DUEL</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050712;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
    touch-action:none;
    overscroll-behavior:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= MENU ================= */

#menu{
    width:min(900px,94vw);
    padding:35px;
    border:1px solid rgba(0,220,255,.3);
    border-radius:28px;
    background:
        radial-gradient(circle at top,#142344 0%,#090d1d 55%,#050712 100%);
    box-shadow:
        0 0 50px rgba(0,200,255,.12),
        inset 0 0 40px rgba(255,255,255,.02);
    text-align:center;
}

.logo{
    font-size:clamp(42px,8vw,82px);
    font-weight:900;
    letter-spacing:6px;
    color:#fff;
    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #00d9ff,
        0 0 55px rgba(0,217,255,.5);
    margin-bottom:8px;
}

.subtitle{
    color:#9ca9c8;
    margin-bottom:28px;
    font-size:15px;
}

.section-title{
    font-size:18px;
    color:#dce8ff;
    margin:18px 0 12px;
}

.mode-row{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
}

.mode-btn{
    width:250px;
    padding:17px 20px;
    border-radius:16px;
    border:1px solid rgba(0,220,255,.28);
    background:linear-gradient(145deg,#111d38,#0b1123);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.mode-btn:hover{
    transform:translateY(-3px);
    border-color:#00d9ff;
    box-shadow:0 0 25px rgba(0,217,255,.2);
}

.mode-btn.active{
    background:linear-gradient(145deg,#063d51,#10244b);
    border-color:#00eaff;
    box-shadow:
        0 0 20px rgba(0,220,255,.28),
        inset 0 0 20px rgba(0,220,255,.08);
}

#difficultyBox{
    display:none;
    margin-top:20px;
}

.difficulty-row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.diff-btn{
    min-width:120px;
    padding:12px 18px;
    border-radius:13px;
    border:1px solid #293653;
    background:#0d1427;
    color:#aab6d1;
    cursor:pointer;
    font-weight:bold;
}

.diff-btn.active{
    color:white;
    border-color:#00d9ff;
    background:#12314b;
}

.start-btn{
    margin-top:28px;
    width:min(400px,90%);
    padding:17px;
    border:0;
    border-radius:17px;
    background:linear-gradient(90deg,#00b7ff,#6c4dff);
    color:white;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 0 30px rgba(0,190,255,.25);
}

.info{
    margin-top:22px;
    color:#71809e;
    font-size:13px;
    line-height:2;
}

/* ================= GAME ================= */

#gameScreen{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#03050d;
}

#gameBox{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(1200px,100vw);
    aspect-ratio:1200 / 700;
    max-height:100vh;
    background:#050916;
    overflow:hidden;
    border:1px solid rgba(0,220,255,.25);
    box-shadow:
        0 0 60px rgba(0,180,255,.08),
        inset 0 0 50px rgba(0,0,0,.5);
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* HOME BUTTON */

#homeBtn{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    border:1px solid rgba(0,220,255,.35);
    background:rgba(4,10,25,.85);
    color:#fff;
    padding:10px 15px;
    border-radius:12px;
    font-family:Tahoma;
    font-size:14px;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

#homeBtn:hover{
    border-color:#00eaff;
    box-shadow:0 0 18px rgba(0,220,255,.25);
}

/* MOBILE CONTROLS */

#mobileControls{
    display:none;
    position:absolute;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:50;
    gap:14px;
    direction:ltr;
}

.mobileBtn{
    width:76px;
    height:76px;
    border-radius:22px;
    border:1px solid rgba(0,230,255,.5);
    background:rgba(8,20,40,.9);
    color:#fff;
    font-size:34px;
    font-weight:bold;
    box-shadow:
        0 0 20px rgba(0,220,255,.16),
        inset 0 0 15px rgba(0,220,255,.05);
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

.mobileBtn:active,
.mobileBtn.pressed{
    background:rgba(0,170,220,.45);
    border-color:#00eaff;
    transform:scale(.94);
    box-shadow:0 0 28px rgba(0,220,255,.4);
}

/* MOBILE FULLSCREEN */

@media(max-width:700px){

    body{
        display:block;
    }

    #menu{
        width:94vw;
        max-height:94vh;
        overflow:auto;
        padding:24px 16px;
        border-radius:22px;
    }

    .logo{
        font-size:43px;
        letter-spacing:3px;
    }

    .mode-btn{
        width:100%;
        max-width:330px;
    }

    #gameBox{
        width:100vw;
        height:100dvh;
        max-height:none;
        aspect-ratio:auto;
        border:0;
        border-radius:0;
    }

    #homeBtn{
        top:calc(10px + env(safe-area-inset-top));
        left:10px;
        padding:9px 12px;
        font-size:12px;
    }

    #mobileControls{
        display:flex;
    }
}

/* very small phones */

@media(max-height:500px) and (max-width:800px){

    #mobileControls{
        bottom:8px;
    }

    .mobileBtn{
        width:62px;
        height:62px;
        border-radius:18px;
        font-size:28px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="logo">NEON DUEL</div>

    <div class="subtitle">
        نبرد دو بازیکنه نئونی
    </div>

    <div class="section-title">
        حالت بازی
    </div>

    <div class="mode-row">

        <button class="mode-btn active" id="twoPlayerBtn">
            🎮 دو نفره
            <br>
            <small>PC / Controller</small>
        </button>

        <button class="mode-btn" id="singlePlayerBtn">
            🤖 تک نفره
            <br>
            <small>مقابل ربات</small>
        </button>

    </div>

    <div id="difficultyBox">

        <div class="section-title">
            درجه سختی ربات
        </div>

        <div class="difficulty-row">

            <button class="diff-btn active" data-diff="normal">
                معمولی
            </button>

            <button class="diff-btn" data-diff="hard">
                سخت
            </button>

            <button class="diff-btn" data-diff="pro">
                حرفه‌ای
            </button>

        </div>

    </div>

    <button class="start-btn" id="startBtn">
        شروع بازی
    </button>

    <div class="info">
        دو نفره: بازیکن ۱ = W / S &nbsp;&nbsp; بازیکن ۲ = ↑ / ↓
        <br>
        موبایل: دکمه‌های پایین صفحه برای بازیکن ۱
        <br>
        دسته PS5: آنالوگ چپ بالا و پایین
    </div>

</div>


<!-- ================= GAME ================= -->

<div id="gameScreen">

    <div id="gameBox">

        <canvas id="canvas" width="1200" height="700"></canvas>

        <button id="homeBtn">
            ⌂ بازگشت به خانه
        </button>

        <!-- فقط یک جفت کنترل برای موبایل -->
        <div id="mobileControls">

            <button class="mobileBtn" id="mobileUp">
                ▲
            </button>

            <button class="mobileBtn" id="mobileDown">
                ▼
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   NEON DUEL
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = 1200;
const H = 700;

/* ================= STATE ================= */

let gameMode = "2p";
let difficulty = "normal";

let gameRunning = false;
let gameOver = false;

let lastTime = 0;

let score1 = 0;
let score2 = 0;

let rallyHits = 0;

let shake = 0;

let particles = [];

let keys = {};

let mobileUp = false;
let mobileDown = false;

let botTimer = 0;
let botTargetY = H / 2;
let botError = 0;

let item = null;

let message = "";
let messageTimer = 0;


/* ================= PLAYERS ================= */

const player1 = {
    x:45,
    y:H/2-70,
    w:22,
    h:140,
    speed:570,
    color:"#00eaff"
};

const player2 = {
    x:W-67,
    y:H/2-70,
    w:22,
    h:140,
    speed:570,
    color:"#ff3bd4"
};


/* ================= BALL ================= */

const ball = {
    x:W/2,
    y:H/2,
    r:12,
    vx:500,
    vy:180,
    baseSpeed:500,
    speed:500,
    fire:false,
    turbo:false,
    slowTimer:0
};


/* ================= ITEMS ================= */

const itemTypes = [
    "FIRE",
    "TURBO",
    "SLOW"
];


/* =========================================================
   MENU
   ========================================================= */

const twoPlayerBtn =
    document.getElementById("twoPlayerBtn");

const singlePlayerBtn =
    document.getElementById("singlePlayerBtn");

const difficultyBox =
    document.getElementById("difficultyBox");

twoPlayerBtn.onclick = () => {

    gameMode = "2p";

    twoPlayerBtn.classList.add("active");
    singlePlayerBtn.classList.remove("active");

    difficultyBox.style.display = "none";
};

singlePlayerBtn.onclick = () => {

    gameMode = "single";

    singlePlayerBtn.classList.add("active");
    twoPlayerBtn.classList.remove("active");

    difficultyBox.style.display = "block";
};

document.querySelectorAll(".diff-btn").forEach(btn => {

    btn.onclick = () => {

        document.querySelectorAll(".diff-btn")
            .forEach(x => x.classList.remove("active"));

        btn.classList.add("active");

        difficulty = btn.dataset.diff;
    };

});


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if([
        "ArrowUp",
        "ArrowDown",
        " "
    ].includes(e.key)){
        e.preventDefault();
    }

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/* =========================================================
   GAMEPAD
   ========================================================= */

function getPads(){

    return navigator.getGamepads
        ? navigator.getGamepads()
        : [];
}


function readGamepad(index){

    const pads = getPads();

    const pad = pads[index];

    if(!pad) return 0;

    let value = 0;

    if(pad.axes && pad.axes.length >= 2){

        value = pad.axes[1];

    }

    if(Math.abs(value) < .18){

        value = 0;

    }

    return value;
}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

function setupMobileButton(button, direction){

    const press = e => {

        e.preventDefault();

        if(direction === "up"){
            mobileUp = true;
        }else{
            mobileDown = true;
        }

        button.classList.add("pressed");
    };


    const release = e => {

        e.preventDefault();

        if(direction === "up"){
            mobileUp = false;
        }else{
            mobileDown = false;
        }

        button.classList.remove("pressed");
    };


    button.addEventListener("pointerdown", press);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("pointerleave", release);

    /* fallback برای گوشی‌هایی که Pointer Event مشکل دارد */

    button.addEventListener("touchstart", press, {
        passive:false
    });

    button.addEventListener("touchend", release, {
        passive:false
    });

    button.addEventListener("touchcancel", release, {
        passive:false
    });
}


setupMobileButton(
    document.getElementById("mobileUp"),
    "up"
);

setupMobileButton(
    document.getElementById("mobileDown"),
    "down"
);


/* =========================================================
   RESET
   ========================================================= */

function resetGame(){

    score1 = 0;
    score2 = 0;

    rallyHits = 0;

    gameOver = false;

    particles = [];

    item = null;

    ball.fire = false;
    ball.turbo = false;
    ball.slowTimer = 0;

    resetRound(1);

    player1.y = H/2 - player1.h/2;
    player2.y = H/2 - player2.h/2;

    botTargetY = H/2;

    botTimer = 0;

    message = "";
    messageTimer = 0;
}


function resetRound(direction){

    ball.x = W/2;
    ball.y = H/2;

    ball.speed = 500;

    ball.fire = false;
    ball.turbo = false;
    ball.slowTimer = 0;

    const angle =
        (Math.random() * .7 - .35);

    ball.vx =
        direction * ball.speed;

    ball.vy =
        ball.speed * Math.sin(angle);

    player1.y = H/2 - player1.h/2;
    player2.y = H/2 - player2.h/2;

    item = null;

    rallyHits = 0;

    botError =
        (Math.random() - .5) * 70;
}


/* =========================================================
   START / HOME
   ========================================================= */

document.getElementById("startBtn").onclick = () => {

    document.getElementById("menu").style.display = "none";

    document.getElementById("gameScreen").style.display = "block";

    resetGame();

    gameRunning = true;

    lastTime = performance.now();

    requestAnimationFrame(loop);
};


document.getElementById("homeBtn").onclick = () => {

    gameRunning = false;

    document.getElementById("gameScreen").style.display = "none";

    document.getElementById("menu").style.display = "block";

    mobileUp = false;
    mobileDown = false;
};


/* =========================================================
   PLAYER 1
   ========================================================= */

function updatePlayer1(dt){

    let dir = 0;

    /* کیبورد */

    if(keys["w"]){
        dir -= 1;
    }

    if(keys["s"]){
        dir += 1;
    }

    /* موبایل */

    if(mobileUp){
        dir -= 1;
    }

    if(mobileDown){
        dir += 1;
    }

    /* دسته اول */

    const gp = readGamepad(0);

    if(gp !== 0){

        dir = gp;

    }

    player1.y += dir * player1.speed * dt;

    player1.y =
        Math.max(
            25,
            Math.min(
                H - player1.h - 25,
                player1.y
            )
        );
}


/* =========================================================
   PLAYER 2 DESKTOP
   ========================================================= */

function updatePlayer2Human(dt){

    let dir = 0;

    if(keys["arrowup"]){
        dir -= 1;
    }

    if(keys["arrowdown"]){
        dir += 1;
    }

    const gp = readGamepad(1);

    if(gp !== 0){

        dir = gp;

    }

    player2.y += dir * player2.speed * dt;

    player2.y =
        Math.max(
            25,
            Math.min(
                H - player2.h - 25,
                player2.y
            )
        );
}


/* =========================================================
   BALL PREDICTION
   ========================================================= */

function predictBallYAtX(targetX){

    if(ball.vx <= 0){
        return ball.y;
    }

    const distance =
        targetX - ball.x;

    if(distance <= 0){
        return ball.y;
    }

    let t =
        distance / Math.max(ball.vx,1);

    /* ربات اجازه ندارد خیلی دور را پیش‌بینی کند */

    t = Math.min(t,.42);

    let predicted =
        ball.y + ball.vy * t;

    const top = 20;
    const bottom = H - 20;

    while(predicted < top || predicted > bottom){

        if(predicted < top){

            predicted =
                top + (top - predicted);

        }

        if(predicted > bottom){

            predicted =
                bottom - (predicted - bottom);

        }

    }

    return predicted;
}


/* =========================================================
   BOT
   ========================================================= */

function updateBot(dt){

    botTimer -= dt;

    /* ربات هر چند صدم ثانیه تصمیم جدید می‌گیرد
       تا کاملاً رباتیک و بی‌نقص نباشد */

    if(botTimer <= 0){

        if(difficulty === "normal"){

            botTimer = .18 + Math.random() * .08;

            botTargetY =
                ball.y +
                (Math.random() - .5) * 150;

        }

        else if(difficulty === "hard"){

            botTimer = .13 + Math.random() * .07;

            if(ball.vx > 0){

                botTargetY =
                    predictBallYAtX(player2.x)
                    + (Math.random() - .5) * 90;

            }else{

                botTargetY =
                    H/2 +
                    (Math.random() - .5) * 160;
            }

        }

        else{

            botTimer = .10 + Math.random() * .08;

            if(ball.vx > 0){

                botTargetY =
                    predictBallYAtX(player2.x)
                    + (Math.random() - .5) * 60;

            }else{

                botTargetY =
                    H/2 +
                    (Math.random() - .5) * 100;
            }

        }
    }


    let center =
        player2.y + player2.h/2;

    let difference =
        botTargetY - center;


    /* سرعت ربات */

    let speed;

    if(difficulty === "normal"){

        speed = 300;

    }else if(difficulty === "hard"){

        speed = 390;

    }else{

        speed = 455;

    }


    /* محدود کردن حرکت */

    let move = 0;

    if(Math.abs(difference) > 12){

        move =
            Math.sign(difference);
    }


    /* کمی تاخیر تصادفی */

    if(Math.random() < .012){

        move = 0;
    }


    player2.y +=
        move * speed * dt;


    player2.y =
        Math.max(
            25,
            Math.min(
                H-player2.h-25,
                player2.y
            )
        );
}


/* =========================================================
   PARTICLES
   ========================================================= */

function particle(x,y,color,count=8){

    for(let i=0;i<count;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*350,
            vy:(Math.random()-.5)*350,

            life:.4 + Math.random()*.5,

            maxLife:.8,

            size:2 + Math.random()*5,

            color:color
        });
    }
}


function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= dt;

        if(p.life <= 0){

            particles.splice(i,1);
        }
    }
}


/* =========================================================
   ITEMS
   ========================================================= */

function spawnItem(){

    if(item) return;

    if(Math.random() > .0025) return;

    const type =
        itemTypes[
            Math.floor(Math.random()*itemTypes.length)
        ];

    item = {

        x:W/2,
        y:80 + Math.random()*(H-160),

        r:25,

        type:type,

        rotation:0
    };
}


function updateItem(dt){

    if(!item) return;

    item.rotation += dt * 2.5;

    const dx =
        ball.x - item.x;

    const dy =
        ball.y - item.y;

    const distance =
        Math.sqrt(dx*dx + dy*dy);

    if(distance < ball.r + item.r){

        activateItem(item.type);

        particle(
            item.x,
            item.y,
            getItemColor(item.type),
            18
        );

        item = null;
    }
}


function getItemColor(type){

    if(type === "FIRE")
        return "#ff3b30";

    if(type === "TURBO")
        return "#00eaff";

    return "#a46cff";
}


function activateItem(type){

    if(type === "FIRE"){

        ball.fire = true;

        message = "🔥 FIRE BALL";
        messageTimer = 1.1;

    }

    if(type === "TURBO"){

        ball.turbo = true;

        ball.speed *= 1.45;

        const sign =
            ball.vx >= 0 ? 1 : -1;

        ball.vx =
            sign * ball.speed;

        message = "⚡ TURBO";
        messageTimer = 1.1;

    }

    if(type === "SLOW"){

        ball.slowTimer = 3;

        message = "🌀 SLOW";
        messageTimer = 1.1;
    }
}


/* =========================================================
   COLLISION
   ========================================================= */

function paddleCollision(p){

    return (
        ball.x + ball.r > p.x &&
        ball.x - ball.r < p.x + p.w &&
        ball.y + ball.r > p.y &&
        ball.y - ball.r < p.y + p.h
    );
}


function hitPaddle(p,isLeft){

    const relative =
        (ball.y - (p.y + p.h/2))
        / (p.h/2);

    const clamped =
        Math.max(-1,Math.min(1,relative));

    const angle =
        clamped * 1.05;


    rallyHits++;


    /* افزایش سرعت هر ۵ برخورد */

    if(rallyHits % 5 === 0){

        ball.speed *= 1.12;

        message = "⚡ SPEED UP!";
        messageTimer = .8;
    }


    let speed =
        ball.speed;

    if(ball.slowTimer > 0){

        speed *= .7;
    }

    if(ball.turbo){

        speed *= 1.12;
    }


    const direction =
        isLeft ? 1 : -1;


    ball.vx =
        direction *
        speed *
        Math.cos(angle);


    ball.vy =
        speed *
        Math.sin(angle);


    if(Math.abs(ball.vy) < 90){

        ball.vy =
            (Math.random() > .5 ? 1 : -1) *
            100;
    }


    if(isLeft){

        ball.x =
            p.x + p.w + ball.r + 2;

    }else{

        ball.x =
            p.x - ball.r - 2;
    }


    particle(
        ball.x,
        ball.y,
        p.color,
        14
    );

    shake = 7;
}


/* =========================================================
   UPDATE BALL
   ========================================================= */

function updateBall(dt){

    if(ball.slowTimer > 0){

        ball.slowTimer -= dt;

        if(ball.slowTimer <= 0){

            ball.slowTimer = 0;
        }
    }


    let currentSpeedMultiplier = 1;

    if(ball.slowTimer > 0){

        currentSpeedMultiplier = .7;
    }


    ball.x +=
        ball.vx *
        dt *
        currentSpeedMultiplier;

    ball.y +=
        ball.vy *
        dt *
        currentSpeedMultiplier;


    /* top */

    if(ball.y - ball.r <= 18){

        ball.y = 18 + ball.r;

        ball.vy =
            Math.abs(ball.vy);

        particle(
            ball.x,
            ball.y,
            "#00eaff",
            8
        );
    }


    /* bottom */

    if(ball.y + ball.r >= H-18){

        ball.y = H-18-ball.r;

        ball.vy =
            -Math.abs(ball.vy);

        particle(
            ball.x,
            ball.y,
            "#ff3bd4",
            8
        );
    }


    /* player 1 */

    if(
        ball.vx < 0 &&
        paddleCollision(player1)
    ){

        hitPaddle(player1,true);
    }


    /* player 2 */

    if(
        ball.vx > 0 &&
        paddleCollision(player2)
    ){

        hitPaddle(player2,false);
    }


    /* score */

    if(ball.x < -50){

        score2++;

        particle(
            25,
            ball.y,
            "#ff3bd4",
            30
        );

        checkWinner();

        if(!gameOver){

            resetRound(-1);

            message = "بازیکن ۲ امتیاز گرفت";
            messageTimer = 1;
        }

    }


    if(ball.x > W+50){

        score1++;

        particle(
            W-25,
            ball.y,
            "#00eaff",
            30
        );

        checkWinner();

        if(!gameOver){

            resetRound(1);

            message = "بازیکن ۱ امتیاز گرفت";
            messageTimer = 1;
        }
    }
}


/* =========================================================
   WINNER
   ========================================================= */

function checkWinner(){

    if(score1 >= 10 || score2 >= 10){

        gameOver = true;

        gameRunning = false;

        if(score1 >= 10){

            message = "🏆 بازیکن ۱ برنده شد!";

        }else{

            message = "🏆 بازیکن ۲ برنده شد!";
        }

        messageTimer = 999;
    }
}


/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

    updatePlayer1(dt);

    if(gameMode === "single"){

        updateBot(dt);

    }else{

        updatePlayer2Human(dt);
    }


    updateBall(dt);

    updateItem(dt);

    spawnItem();

    updateParticles(dt);

    if(messageTimer > 0){

        messageTimer -= dt;
    }

    if(shake > 0){

        shake *= .88;

        if(shake < .1){

            shake = 0;
        }
    }
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#050b19");
    gradient.addColorStop(.5,"#071020");
    gradient.addColorStop(1,"#030711");

    ctx.fillStyle = gradient;

    ctx.fillRect(0,0,W,H);


    /* glow وسط */

    const glow =
        ctx.createRadialGradient(
            W/2,H/2,20,
            W/2,H/2,500
        );

    glow.addColorStop(
        0,
        "rgba(0,190,255,.07)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(0,0,W,H);


    /* خطوط زمین */

    ctx.strokeStyle =
        "rgba(0,220,255,.07)";

    ctx.lineWidth = 1;

    for(let x=0;x<=W;x+=60){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();
    }

    for(let y=0;y<=H;y+=60){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }


    /* وسط */

    ctx.setLineDash([12,16]);

    ctx.strokeStyle =
        "rgba(255,255,255,.13)";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(W/2,20);
    ctx.lineTo(W/2,H-20);

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        100,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "rgba(0,220,255,.10)";

    ctx.stroke();
}


/* =========================================================
   DRAW PADDLE
   ========================================================= */

function drawPaddle(p){

    ctx.save();

    ctx.shadowColor = p.color;
    ctx.shadowBlur = 25;

    const gradient =
        ctx.createLinearGradient(
            p.x,
            p.y,
            p.x+p.w,
            p.y
        );

    gradient.addColorStop(0,p.color);
    gradient.addColorStop(.5,"#fff");
    gradient.addColorStop(1,p.color);

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.roundRect(
        p.x,
        p.y,
        p.w,
        p.h,
        10
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   DRAW BALL
   ========================================================= */

function drawBall(){

    ctx.save();

    const color =
        ball.fire
        ? "#ff3b30"
        : "#ffffff";

    ctx.shadowColor = color;

    ctx.shadowBlur =
        ball.fire ? 45 : 28;


    /* trail */

    for(let i=1;i<=7;i++){

        const tx =
            ball.x -
            ball.vx * .00008 * i;

        const ty =
            ball.y -
            ball.vy * .00008 * i;

        ctx.globalAlpha =
            .08 * (8-i);

        ctx.fillStyle = color;

        ctx.beginPath();

        ctx.arc(
            tx,
            ty,
            ball.r * (1-i*.07),
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha = 1;

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   DRAW ITEM
   ========================================================= */

function drawItem(){

    if(!item) return;

    ctx.save();

    ctx.translate(
        item.x,
        item.y
    );

    ctx.rotate(
        item.rotation
    );

    const color =
        getItemColor(item.type);

    ctx.shadowColor = color;
    ctx.shadowBlur = 25;

    ctx.strokeStyle = color;
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.roundRect(
        -item.r,
        -item.r,
        item.r*2,
        item.r*2,
        10
    );

    ctx.stroke();

    ctx.fillStyle = color;

    ctx.font = "bold 11px Tahoma";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        item.type,
        0,
        0
    );

    ctx.restore();
}


/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

    for(const p of particles){

        ctx.save();

        ctx.globalAlpha =
            Math.max(0,p.life/p.maxLife);

        ctx.fillStyle = p.color;

        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   DRAW SCORE
   ========================================================= */

function drawScore(){

    ctx.save();

    ctx.textAlign = "center";

    ctx.font =
        "900 82px Arial";

    ctx.shadowBlur = 25;

    ctx.shadowColor = "#00eaff";

    ctx.fillStyle =
        "rgba(0,234,255,.8)";

    ctx.fillText(
        score1,
        W/2-120,
        105
    );


    ctx.shadowColor = "#ff3bd4";

    ctx.fillStyle =
        "rgba(255,59,212,.8)";

    ctx.fillText(
        score2,
        W/2+120,
        105
    );

    ctx.restore();


    ctx.font =
        "bold 14px Tahoma";

    ctx.fillStyle =
        "rgba(255,255,255,.35)";

    ctx.textAlign = "center";

    ctx.fillText(
        gameMode === "single"
        ? "PLAYER 1   VS   BOT"
        : "PLAYER 1   VS   PLAYER 2",
        W/2,
        145
    );
}


/* =========================================================
   DRAW MESSAGE
   ========================================================= */

function drawMessage(){

    if(messageTimer <= 0) return;

    ctx.save();

    ctx.textAlign = "center";

    ctx.font =
        "bold 27px Tahoma";

    ctx.shadowColor = "#00eaff";

    ctx.shadowBlur = 20;

    ctx.fillStyle = "#ffffff";

    ctx.fillText(
        message,
        W/2,
        H-55
    );

    ctx.restore();
}


/* =========================================================
   GAME OVER
   ========================================================= */

function drawGameOver(){

    if(!gameOver) return;

    ctx.save();

    ctx.fillStyle =
        "rgba(0,0,0,.72)";

    ctx.fillRect(
        0,0,W,H
    );


    ctx.textAlign = "center";

    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 35;

    ctx.fillStyle = "#fff";

    ctx.font =
        "900 58px Tahoma";

    ctx.fillText(
        score1 >= 10
        ? "بازیکن ۱ برنده شد!"
        : "بازیکن ۲ برنده شد!",
        W/2,
        H/2-40
    );


    ctx.font =
        "bold 24px Tahoma";

    ctx.shadowBlur = 15;

    ctx.fillText(
        `${score1}  -  ${score2}`,
        W/2,
        H/2+20
    );


    ctx.font =
        "16px Tahoma";

    ctx.fillStyle =
        "#9ca9c8";

    ctx.fillText(
        "برای برگشت به منو روی «بازگشت به خانه» بزنید",
        W/2,
        H/2+70
    );

    ctx.restore();
}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

    ctx.save();

    if(shake > 0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
    }

    drawBackground();

    drawScore();

    drawItem();

    drawPaddle(player1);

    drawPaddle(player2);

    drawBall();

    drawParticles();

    drawMessage();

    drawGameOver();

    ctx.restore();
}


/* =========================================================
   LOOP
   ========================================================= */

function loop(time){

    if(!gameRunning){

        draw();

        return;
    }


    let dt =
        (time-lastTime)/1000;

    lastTime = time;


    /* جلوگیری از جهش بعد از هنگ */

    dt =
        Math.min(dt,.033);


    update(dt);

    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   INITIAL DRAW
   ========================================================= */

draw();


/* =========================================================
   RESIZE / PREVENT TOUCH SCROLL
   ========================================================= */

window.addEventListener(
    "touchmove",
    e => {
        e.preventDefault();
    },
    {passive:false}
);


window.addEventListener(
    "gesturestart",
    e => {
        e.preventDefault();
    },
    {passive:false}
);


/* آزاد کردن دکمه موبایل اگر انگشت از صفحه خارج شد */

document.addEventListener("touchend", () => {

    mobileUp = false;
    mobileDown = false;

    document
        .querySelectorAll(".mobileBtn")
        .forEach(btn => btn.classList.remove("pressed"));

});


document.addEventListener("pointerup", () => {

    mobileUp = false;
    mobileDown = false;

    document
        .querySelectorAll(".mobileBtn")
        .forEach(btn => btn.classList.remove("pressed"));

});

</script>
