<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NEON DUEL</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050816;
  font-family:Tahoma,Arial,sans-serif;
  color:white;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

#gameBox{
  position:relative;
  width:min(1200px,100vw);
  height:min(700px,100vh);
  aspect-ratio:1200/700;
  background:#07101f;
  overflow:hidden;
  border:2px solid #162b4d;
  box-shadow:
    0 0 40px #006eff22,
    inset 0 0 40px #001b3c;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* MENU */

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,#102c55 0,#07101f 45%,#030611 100%);
}

.panel{
  width:min(560px,90%);
  padding:35px;
  border:1px solid #247cff55;
  border-radius:25px;
  background:#071425ee;
  box-shadow:0 0 50px #0077ff22;
  text-align:center;
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:5px;
  color:#53b9ff;
  text-shadow:
    0 0 10px #008cff,
    0 0 30px #008cff;
  margin-bottom:8px;
}

.subtitle{
  color:#8195b8;
  margin-bottom:28px;
}

.sectionTitle{
  font-size:14px;
  color:#8ca6cc;
  margin:18px 0 10px;
}

.modeRow,
.scoreRow{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.modeBtn,
.scoreBtn{
  border:1px solid #285183;
  background:#0a1b32;
  color:#bdd5f7;
  border-radius:12px;
  padding:13px 20px;
  font-family:inherit;
  cursor:pointer;
  transition:.15s;
}

.modeBtn:hover,
.scoreBtn:hover{
  transform:translateY(-2px);
  border-color:#49aaff;
}

.modeBtn.active,
.scoreBtn.active{
  color:white;
  border-color:#40b5ff;
  background:#12345c;
  box-shadow:0 0 18px #008cff33;
}

#startBtn{
  width:100%;
  margin-top:25px;
  padding:17px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#008cff,#0059ff);
  color:white;
  font-family:inherit;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 25px #0077ff55;
}

#startBtn:active{
  transform:scale(.98);
}

.controls{
  margin-top:22px;
  color:#7890b5;
  font-size:12px;
  line-height:2;
}

/* HOME */

#homeBtn{
  position:absolute;
  z-index:10;
  top:15px;
  right:15px;
  display:none;
  border:1px solid #315d8e;
  background:#07182bcc;
  color:#b9d8ff;
  padding:9px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* MESSAGE */

#message{
  position:absolute;
  inset:0;
  z-index:15;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#020713aa;
  backdrop-filter:blur(5px);
}

#message h2{
  margin:0;
  font-size:42px;
  color:#fff;
  text-shadow:0 0 20px #008cff;
}

#message p{
  color:#9cb4d7;
}

/* MOBILE */

#mobileHint{
  display:none;
  position:absolute;
  z-index:8;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 12px;
  border-radius:20px;
  background:#06152ad9;
  border:1px solid #32618e66;
  color:#a9c9ef;
  font-size:11px;
  pointer-events:none;
}

/*
  منطقه کنترل موبایل:
  نیمه چپ صفحه = حرکت بازیکن ۱
*/
#mobileTouch{
  display:none;
  position:absolute;
  inset:0;
  z-index:7;
  touch-action:none;
}

#touchZone{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:50%;
  touch-action:none;
}

#touchVisual{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  border:2px solid #43baff88;
  background:#168cff12;
  box-shadow:
    0 0 25px #008cff22,
    inset 0 0 25px #008cff11;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:none;
}

#touchVisual::after{
  content:"";
  position:absolute;
  width:35px;
  height:35px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#43baff;
  box-shadow:0 0 20px #008cff;
}

/* موبایل */

@media(max-width:700px){

  body{
    background:#02050d;
  }

  #gameBox{
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
    border:0;
    border-radius:0;
  }

  #mobileTouch{
    display:block;
  }

  #mobileHint{
    display:block;
  }

  #homeBtn{
    top:10px;
    right:10px;
    font-size:11px;
    padding:7px 10px;
  }

  .panel{
    width:92%;
    padding:24px 18px;
    border-radius:20px;
  }

  .logo{
    font-size:35px;
  }

  .subtitle{
    font-size:12px;
    margin-bottom:18px;
  }

  .modeBtn,
  .scoreBtn{
    padding:10px 15px;
    font-size:12px;
  }

  .controls{
    font-size:10px;
  }

  #message h2{
    font-size:30px;
  }
}

/* اگر گوشی عمودی باشد، بازی همچنان کنترل‌پذیر است */
@media(max-width:700px) and (orientation:portrait){

  #mobileHint{
    top:55px;
  }

  .panel{
    transform:scale(.88);
  }
}
</style>
</head>

<body>

<div id="gameBox">

  <canvas id="game" width="1200" height="700"></canvas>

  <button id="homeBtn">⌂ منو</button>

  <div id="mobileHint">
    انگشتت را روی سمت چپ صفحه بالا و پایین بکش
  </div>

  <div id="mobileTouch">
    <div id="touchZone"></div>
    <div id="touchVisual"></div>
  </div>

  <div id="message">
    <h2 id="messageTitle"></h2>
    <p id="messageText"></p>
  </div>

  <div id="menu">

    <div class="panel">

      <div class="logo">NEON DUEL</div>

      <div class="subtitle">
        دوئل نئونی سرعتی
      </div>

      <div class="sectionTitle">
        حالت بازی
      </div>

      <div class="modeRow">

        <button class="modeBtn active" data-mode="bot">
          🤖 یک نفره
        </button>

        <button class="modeBtn" data-mode="2p">
          🎮 دو نفره
        </button>

      </div>

      <div class="sectionTitle">
        بازی تا چند امتیاز؟
      </div>

      <div class="scoreRow">

        <button class="scoreBtn" data-score="3">۳</button>
        <button class="scoreBtn" data-score="5">۵</button>
        <button class="scoreBtn" data-score="7">۷</button>
        <button class="scoreBtn active" data-score="10">۱۰</button>

      </div>

      <div class="sectionTitle" id="difficultyTitle">
        سختی ربات
      </div>

      <div class="modeRow" id="difficultyRow">

        <button class="modeBtn" data-difficulty="easy">
          آسان
        </button>

        <button class="modeBtn active" data-difficulty="normal">
          معمولی
        </button>

        <button class="modeBtn" data-difficulty="hard">
          سخت
        </button>

      </div>

      <button id="startBtn">
        شروع بازی
      </button>

      <div class="controls">
        📱 گوشی: انگشتت را در سمت چپ صفحه بالا و پایین بکش<br>
        💻 کامپیوتر: W / S<br>
        🎮 دسته: آنالوگ چپ
      </div>

    </div>

  </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* -----------------------------
   GAME SETTINGS
----------------------------- */

let gameMode = "bot";
let difficulty = "normal";
let MAX_SCORE = 10;

let running = false;
let lastTime = 0;

let p1Score = 0;
let p2Score = 0;
let hits = 0;

let particles = [];
let items = [];

let touchMove = 0;

const keys = {};

/* -----------------------------
   DOM
----------------------------- */

const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");
const homeBtn = document.getElementById("homeBtn");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");

const touchZone = document.getElementById("touchZone");
const touchVisual = document.getElementById("touchVisual");

/* -----------------------------
   PADDLES
----------------------------- */

const p1 = {
  x:55,
  y:H/2-65,
  w:24,
  h:130,
  speed:560
};

const p2 = {
  x:W-79,
  y:H/2-65,
  w:24,
  h:130,
  speed:560
};

/* -----------------------------
   BALL
----------------------------- */

const ball = {
  x:W/2,
  y:H/2,
  r:13,
  vx:0,
  vy:0,
  speed:500,
  fire:false
};

const BASE_SPEED = 500;
const MAX_SPEED = 1300;

/* -----------------------------
   ITEMS
----------------------------- */

const itemTypes = [
  "fire",
  "turbo",
  "slow"
];

/* -----------------------------
   INPUT
----------------------------- */

window.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;

  if(
    ["arrowup","arrowdown","w","s"," "].includes(
      e.key.toLowerCase()
    )
  ){
    e.preventDefault();
  }
});

window.addEventListener("keyup", e=>{
  keys[e.key.toLowerCase()] = false;
});

/* -----------------------------
   MENU MODE
----------------------------- */

document.querySelectorAll(".modeBtn[data-mode]").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
      .querySelectorAll(".modeBtn[data-mode]")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    gameMode = btn.dataset.mode;

    document.getElementById("difficultyRow").style.display =
      gameMode === "bot" ? "flex" : "none";

    document.getElementById("difficultyTitle").style.display =
      gameMode === "bot" ? "block" : "none";

  });

});

/* -----------------------------
   SCORE SELECT
----------------------------- */

document.querySelectorAll(".scoreBtn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
      .querySelectorAll(".scoreBtn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    MAX_SCORE = Number(btn.dataset.score);

  });

});

/* -----------------------------
   DIFFICULTY
----------------------------- */

document.querySelectorAll(".modeBtn[data-difficulty]").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
      .querySelectorAll(".modeBtn[data-difficulty]")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    difficulty = btn.dataset.difficulty;

  });

});

/* -----------------------------
   MOBILE TOUCH CONTROL
----------------------------- */

let activeTouch = null;

function updateTouch(clientX,clientY){

  const rect = touchZone.getBoundingClientRect();

  let y = clientY - rect.top;

  y = Math.max(
    0,
    Math.min(rect.height,y)
  );

  const ratio = y / rect.height;

  /*
    بالای صفحه = -1
    وسط = 0
    پایین = +1
  */

  touchMove = (ratio - 0.5) * 2;

  touchVisual.style.display = "block";

  touchVisual.style.left =
    clientX + "px";

  touchVisual.style.top =
    clientY + "px";
}

function resetTouch(){

  activeTouch = null;
  touchMove = 0;

  touchVisual.style.display = "none";
}

/*
  pointer events باعث می‌شوند
  لمس گوشی درست کار کند.
*/

touchZone.addEventListener(
  "pointerdown",
  e=>{

    if(activeTouch !== null) return;

    activeTouch = e.pointerId;

    touchZone.setPointerCapture(e.pointerId);

    updateTouch(
      e.clientX,
      e.clientY
    );

    e.preventDefault();

  },
  {passive:false}
);

touchZone.addEventListener(
  "pointermove",
  e=>{

    if(e.pointerId !== activeTouch) return;

    updateTouch(
      e.clientX,
      e.clientY
    );

    e.preventDefault();

  },
  {passive:false}
);

touchZone.addEventListener(
  "pointerup",
  e=>{

    if(e.pointerId === activeTouch){
      resetTouch();
    }

  },
  {passive:false}
);

touchZone.addEventListener(
  "pointercancel",
  e=>{

    if(e.pointerId === activeTouch){
      resetTouch();
    }

  },
  {passive:false}
);

/* -----------------------------
   GAMEPAD
----------------------------- */

function getGamepads(){

  if(!navigator.getGamepads){
    return [];
  }

  return Array.from(
    navigator.getGamepads()
  ).filter(Boolean);

}

function getP1Gamepad(){

  const pads = getGamepads();

  return pads[0] || null;

}

function getP2Gamepad(){

  const pads = getGamepads();

  return pads[1] || null;

}

/* -----------------------------
   BOT
----------------------------- */

function botControl(dt){

  let targetY = ball.y;

  /*
    سختی ربات
  */

  let reaction;

  if(difficulty === "easy"){
    reaction = 0.055;
  }
  else if(difficulty === "hard"){
    reaction = 0.14;
  }
  else{
    reaction = 0.09;
  }

  const center = p2.y + p2.h/2;

  const difference = targetY - center;

  p2.y += difference * reaction;

}

/* -----------------------------
   PADDLE MOVEMENT
----------------------------- */

function updatePaddles(dt){

  /*
    بازیکن ۱:
    گوشی
    کیبورد
    دسته
  */

  let p1Input = touchMove;

  if(keys["w"]){
    p1Input = -1;
  }

  if(keys["s"]){
    p1Input = 1;
  }

  const gp1 = getP1Gamepad();

  if(gp1 && Math.abs(gp1.axes[1]) > 0.12){
    p1Input = gp1.axes[1];
  }

  p1.y += p1Input * p1.speed * dt;

  /*
    بازیکن ۲
  */

  if(gameMode === "bot"){

    botControl(dt);

  }
  else{

    let p2Input = 0;

    if(keys["arrowup"]){
      p2Input = -1;
    }

    if(keys["arrowdown"]){
      p2Input = 1;
    }

    const gp2 = getP2Gamepad();

    if(gp2 && Math.abs(gp2.axes[1]) > 0.12){
      p2Input = gp2.axes[1];
    }

    p2.y += p2Input * p2.speed * dt;

  }

  p1.y = Math.max(
    25,
    Math.min(H-p1.h-25,p1.y)
  );

  p2.y = Math.max(
    25,
    Math.min(H-p2.h-25,p2.y)
  );

}

/* -----------------------------
   BALL RESET
----------------------------- */

function resetBall(direction){

  ball.x = W/2;
  ball.y = H/2;

  ball.speed = BASE_SPEED;
  ball.fire = false;

  const angle =
    (Math.random()*0.9 - 0.45);

  ball.vx =
    Math.cos(angle) *
    ball.speed *
    direction;

  ball.vy =
    Math.sin(angle) *
    ball.speed;

}

/* -----------------------------
   PARTICLES
----------------------------- */

function createParticles(x,y,count=12){

  for(let i=0;i<count;i++){

    particles.push({

      x,
      y,

      vx:(Math.random()-.5)*500,
      vy:(Math.random()-.5)*500,

      life:.5 + Math.random()*.4,
      max:.9

    });

  }

}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.life -= dt;

    if(p.life <= 0){
      particles.splice(i,1);
    }

  }

}

/* -----------------------------
   ITEMS
----------------------------- */

function spawnItem(){

  if(items.length > 0) return;

  const type =
    itemTypes[
      Math.floor(
        Math.random()*itemTypes.length
      )
    ];

  items.push({

    x:W/2,
    y:100+Math.random()*(H-200),

    r:18,

    type,

    life:8

  });

}

function updateItems(dt){

  for(let i=items.length-1;i>=0;i--){

    items[i].life -= dt;

    if(items[i].life <= 0){
      items.splice(i,1);
    }

  }

  if(
    running &&
    Math.random() < dt*.12 &&
    items.length === 0
  ){

    spawnItem();

  }

}

/* -----------------------------
   ITEM COLLISION
----------------------------- */

function checkItemCollision(){

  for(let i=items.length-1;i>=0;i--){

    const item = items[i];

    const distance =
      Math.hypot(
        ball.x-item.x,
        ball.y-item.y
      );

    if(distance < ball.r + item.r){

      if(item.type === "fire"){

        ball.fire = true;

        ball.speed =
          Math.min(
            MAX_SPEED,
            ball.speed + 260
          );

      }

      if(item.type === "turbo"){

        ball.speed =
          Math.min(
            MAX_SPEED,
            ball.speed + 400
          );

      }

      if(item.type === "slow"){

        ball.speed =
          Math.max(
            300,
            ball.speed - 180
          );

      }

      createParticles(
        item.x,
        item.y,
        20
      );

      items.splice(i,1);

      updateBallVelocity();

    }

  }

}

/* -----------------------------
   BALL VELOCITY
----------------------------- */

function updateBallVelocity(){

  const current =
    Math.hypot(
      ball.vx,
      ball.vy
    );

  if(current === 0) return;

  const scale =
    ball.speed/current;

  ball.vx *= scale;
  ball.vy *= scale;

}

/* -----------------------------
   PADDLE COLLISION
----------------------------- */

function paddleCollision(paddle,direction){

  if(
    ball.x-ball.r < paddle.x+paddle.w &&
    ball.x+ball.r > paddle.x &&
    ball.y+ball.r > paddle.y &&
    ball.y-ball.r < paddle.y+paddle.h
  ){

    if(
      direction === 1 &&
      ball.vx < 0
    ){

      ball.x =
        paddle.x+paddle.w+ball.r;

      hitPaddle(paddle,1);

    }

    if(
      direction === -1 &&
      ball.vx > 0
    ){

      ball.x =
        paddle.x-ball.r;

      hitPaddle(paddle,-1);

    }

  }

}

function hitPaddle(paddle,direction){

  hits++;

  /*
    هر ۵ برخورد
    سرعت بیشتر می‌شود
  */

  if(hits % 5 === 0){

    ball.speed =
      Math.min(
        MAX_SPEED,
        ball.speed + 100
      );

  }

  /*
    زاویه برخورد بر اساس محل برخورد
  */

  const center =
    paddle.y+paddle.h/2;

  const relative =
    (ball.y-center) /
    (paddle.h/2);

  const maxAngle =
    Math.PI*0.42;

  const angle =
    relative*maxAngle;

  const speed =
    Math.min(
      MAX_SPEED,
      ball.speed + 20
    );

  ball.speed = speed;

  ball.vx =
    Math.cos(angle) *
    speed *
    direction;

  ball.vy =
    Math.sin(angle) *
    speed;

  createParticles(
    ball.x,
    ball.y,
    12
  );

}

/* -----------------------------
   SCORE
----------------------------- */

function scorePoint(player){

  if(player === 1){
    p1Score++;
  }
  else{
    p2Score++;
  }

  createParticles(
    W/2,
    H/2,
    35
  );

  if(
    p1Score >= MAX_SCORE ||
    p2Score >= MAX_SCORE
  ){

    finishGame();

  }
  else{

    resetBall(
      player === 1 ? 1 : -1
    );

  }

}

function finishGame(){

  running = false;

  const winner =
    p1Score > p2Score
      ? "PLAYER 1"
      : "PLAYER 2";

  messageTitle.textContent =
    winner + " WIN";

  messageText.textContent =
    `${p1Score}  -  ${p2Score}`;

  message.style.display =
    "flex";

  setTimeout(()=>{

    message.style.display =
      "none";

    menu.style.display =
      "flex";

    homeBtn.style.display =
      "none";

  },1800);

}

/* -----------------------------
   BALL UPDATE
----------------------------- */

function updateBall(dt){

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  /*
    بالا / پایین
  */

  if(ball.y-ball.r < 0){

    ball.y = ball.r;
    ball.vy = Math.abs(ball.vy);

  }

  if(ball.y+ball.r > H){

    ball.y = H-ball.r;
    ball.vy = -Math.abs(ball.vy);

  }

  paddleCollision(p1,1);
  paddleCollision(p2,-1);

  checkItemCollision();

  /*
    گل
  */

  if(ball.x < -50){

    scorePoint(2);

  }

  if(ball.x > W+50){

    scorePoint(1);

  }

}

/* -----------------------------
   DRAW
----------------------------- */

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  gradient.addColorStop(
    0,
    "#08182e"
  );

  gradient.addColorStop(
    1,
    "#020712"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,0,W,H
  );

  /*
    خطوط زمین
  */

  ctx.strokeStyle =
    "#1d4770";

  ctx.lineWidth = 2;

  ctx.strokeRect(
    22,
    22,
    W-44,
    H-44
  );

  ctx.setLineDash([
    16,
    18
  ]);

  ctx.strokeStyle =
    "#2372a855";

  ctx.beginPath();

  ctx.moveTo(
    W/2,
    25
  );

  ctx.lineTo(
    W/2,
    H-25
  );

  ctx.stroke();

  ctx.setLineDash([]);

}

function drawPaddle(paddle,isP1){

  const gradient =
    ctx.createLinearGradient(
      0,
      paddle.y,
      0,
      paddle.y+paddle.h
    );

  gradient.addColorStop(
    0,
    isP1 ? "#4cc9ff" : "#ff3f8e"
  );

  gradient.addColorStop(
    1,
    isP1 ? "#006cff" : "#9c0055"
  );

  ctx.shadowBlur = 25;

  ctx.shadowColor =
    isP1 ? "#008cff" : "#ff0077";

  ctx.fillStyle =
    gradient;

  ctx.beginPath();

  ctx.roundRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h,
    12
  );

  ctx.fill();

  ctx.shadowBlur = 0;

}

function drawBall(){

  ctx.save();

  ctx.shadowBlur =
    ball.fire ? 40 : 25;

  ctx.shadowColor =
    ball.fire
      ? "#ff7300"
      : "#ffffff";

  const gradient =
    ctx.createRadialGradient(
      ball.x-4,
      ball.y-4,
      2,
      ball.x,
      ball.y,
      ball.r
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .5,
    ball.fire
      ? "#ffb000"
      : "#75d7ff"
  );

  gradient.addColorStop(
    1,
    ball.fire
      ? "#ff3100"
      : "#008cff"
  );

  ctx.fillStyle =
    gradient;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}

function drawItems(){

  items.forEach(item=>{

    let color;

    if(item.type === "fire"){
      color = "#ff6b00";
    }
    else if(item.type === "turbo"){
      color = "#00eaff";
    }
    else{
      color = "#b45cff";
    }

    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor = color;

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
      item.x,
      item.y,
      item.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 14px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    let symbol =
      item.type === "fire"
        ? "🔥"
        : item.type === "turbo"
          ? "⚡"
          : "◈";

    ctx.fillText(
      symbol,
      item.x,
      item.y
    );

    ctx.restore();

  });

}

function drawParticles(){

  particles.forEach(p=>{

    const alpha =
      Math.max(
        0,
        p.life/p.max
      );

    ctx.globalAlpha =
      alpha;

    ctx.fillStyle =
      "#55cfff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.globalAlpha = 1;

}

function drawUI(){

  ctx.textAlign =
    "center";

  ctx.font =
    "bold 64px Arial";

  ctx.fillStyle =
    "#ffffff";

  ctx.shadowBlur = 20;
  ctx.shadowColor =
    "#168cff";

  ctx.fillText(
    p1Score,
    W/2-75,
    95
  );

  ctx.shadowColor =
    "#ff0077";

  ctx.fillText(
    p2Score,
    W/2+75,
    95
  );

  ctx.shadowBlur = 0;

  ctx.font =
    "14px Arial";

  ctx.fillStyle =
    "#7fa3ca";

  ctx.fillText(
    "FIRST TO " + MAX_SCORE,
    W/2,
    125
  );

  ctx.font =
    "13px Arial";

  ctx.fillStyle =
    "#6483a9";

  ctx.fillText(
    "HITS  " + hits +
    "     SPEED  " +
    Math.round(ball.speed),
    W/2,
    H-25
  );

}

function draw(){

  drawBackground();

  drawItems();

  drawPaddle(
    p1,
    true
  );

  drawPaddle(
    p2,
    false
  );

  drawBall();

  drawParticles();

  drawUI();

}

/* -----------------------------
   GAME LOOP
----------------------------- */

function loop(time){

  const dt =
    Math.min(
      .033,
      (time-lastTime)/1000 || 0
    );

  lastTime = time;

  if(running){

    updatePaddles(dt);
    updateBall(dt);
    updateItems(dt);
    updateParticles(dt);

  }

  draw();

  requestAnimationFrame(loop);

}

/* -----------------------------
   START GAME
----------------------------- */

function resetGame(){

  p1Score = 0;
  p2Score = 0;
  hits = 0;

  particles = [];
  items = [];

  p1.y =
    H/2-p1.h/2;

  p2.y =
    H/2-p2.h/2;

  resetBall(
    Math.random() < .5
      ? -1
      : 1
  );

}

startBtn.addEventListener(
  "click",
  ()=>{

    resetGame();

    menu.style.display =
      "none";

    homeBtn.style.display =
      "block";

    message.style.display =
      "none";

    running = true;

  }
);

/* -----------------------------
   HOME
----------------------------- */

homeBtn.addEventListener(
  "click",
  ()=>{

    running = false;

    touchMove = 0;

    resetTouch();

    homeBtn.style.display =
      "none";

    menu.style.display =
      "flex";

  }
);

/* -----------------------------
   INITIAL DRAW
----------------------------- */

resetGame();

requestAnimationFrame(loop);

</script>
